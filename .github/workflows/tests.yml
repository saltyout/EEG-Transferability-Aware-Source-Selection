name: CPU reproducibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/verify_results.py
      - run: python scripts/make_demo.py --output outputs/synthetic.npz
      - run: python scripts/reproduce.py --features outputs/synthetic.npz --output outputs/demo
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
